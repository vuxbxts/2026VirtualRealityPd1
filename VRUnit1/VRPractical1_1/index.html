<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Car body -->
    <a-box position="0 1 -4"
      width="3" height="1" depth="1.5"
      color="#4CC3D9"></a-box>
    <!-- Car top -->
    <a-box position="0 1.7 -4"
      width="1.8" height="0.5" depth="1.2"
      color="#EF2D5E"></a-box>
    <!-- 4 wheels -->
    <a-cylinder position="-1 0.5 -3.4"
      radius="0.4" height="0.3"
      rotation="90 0 0"
      color="black"></a-cylinder>
    <a-cylinder position="1 0.5 -3.4"
      radius="0.4" height="0.3"
      rotation="90 0 0"
      color="black"></a-cylinder>
    <a-cylinder position="-1 0.5 -4.6"
      radius="0.4" height="0.3"
      rotation="90 0 0"
      color="black"></a-cylinder>
    <a-cylinder position="1 0.5 -4.6"
      radius="0.4" height="0.3"
      rotation="90 0 0"
      color="black"></a-cylinder>
    <!-- Ground -->
    <a-plane position="0 0 -4"
      rotation="-90 0 0"
      width="10" height="10"
      color="#7BC8A4"></a-plane>
    <a-sky color="#ECECEC"></a-sky>
    <a-camera position="0 1.4 5"></a-camera>
  </a-scene>
</body>
</html>
